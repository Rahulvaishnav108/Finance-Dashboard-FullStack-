services:
  mongo:
    image: mongo:7
    container_name: restaurant-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - restaurant-network

  backend:
    build:
      context: ./backend
      target: dev
    container_name: restaurant-backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    env_file:
      - ./backend/.env
    environment:
      MONGODB_URI: mongodb://mongo:27017/restaurant-automation
    networks:
      - restaurant-network
    depends_on:
      - mongo

  frontend:
    build:
      context: ./frontend
    container_name: restaurant-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    env_file:
      - ./frontend/.env
    networks:
      - restaurant-network
    depends_on:
      - backend

networks:
  restaurant-network:
    driver: bridge

volumes:
  mongo-data:
